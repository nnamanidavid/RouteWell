# Place this at /etc/nginx/sites-available/routewell on the Web VM
# then: sudo ln -s /etc/nginx/sites-available/routewell /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    root /var/www/routewell;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Reverse proxy to the App tier. Replace with the App VM's PRIVATE IP.
    # This is the only path from Web -> App, matching the NSG rule
    # (Web Subnet -> App Subnet, port 8080).
    location /api/ {
        proxy_pass http://APP_VM_PRIVATE_IP:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

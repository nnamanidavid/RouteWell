services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: routewell
      POSTGRES_USER: routewell
      POSTGRES_PASSWORD: changeme
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  app:
    build: ./app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: routewell
      DB_PASSWORD: changeme
      DB_NAME: routewell
    depends_on:
      - db

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - app
